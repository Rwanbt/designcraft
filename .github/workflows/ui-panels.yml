# Fast headless egui interaction smoke tests for the DesignCraft fork.
name: Interactive panel smoke
on:
  push:
    branches: [test/ui-interactive-panels-20261012, test/swatches-selected-coverage-20261013, test/properties-selected-coverage-20261013]
  pull_request:
    branches: [main]
    paths:
      - "crates/ui-egui/src/panels/interactive.rs"
      - "crates/ui-egui/src/panels/swatches.rs"
      - "crates/ui-egui/src/panels/properties.rs"
      - ".github/workflows/ui-panels.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: interactive-panel-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: interactive-panel-smoke
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p designcraft-ui-egui --all-targets --locked -- -D warnings
      - run: cargo test -p designcraft-ui-egui --lib --locked -- --nocapture
