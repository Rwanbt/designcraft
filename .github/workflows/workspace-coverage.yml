# Fork-specific instrumented workspace baseline; no arbitrary coverage pass threshold.
name: Instrumented workspace coverage

on:
  push:
    branches: [test/workspace-coverage-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-workspace-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  workspace:
    name: LLVM Rust workspace coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview, clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: workspace-coverage
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.24 --locked
      - name: Instrument and run workspace suite
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/workspace.lcov
      - name: Summarize collected LCOV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          lines = Path("coverage/workspace.lcov").read_text().splitlines()
          files = []
          curr = {}
          for line in lines:
              if line.startswith("SF:"):
                  curr = {"file": line[3:]}
              elif line.startswith("LF:"):
                  curr["lines"] = int(line[3:])
              elif line.startswith("LH:"):
                  curr["hit"] = int(line[3:])
              elif line == "end_of_record" and curr.get("lines", 0) > 0:
                  files.append(curr)
                  curr = {}
          assert files, "Instrumented LCOV has no source files"
          hit = sum(f["hit"] for f in files)
          total = sum(f["lines"] for f in files)
          assert total > 0 and hit <= total
          summary = f"Coverage (line, instrumented Rust workspace): {hit}/{total} = {100*hit/total:.2f}% across {len(files)} files"
          print(summary)
          report = {"sha": "${{ github.sha }}", "covered_lines": hit, "instrumented_lines": total, "percent_lines": round(100*hit/total,2), "files": files}
          Path("coverage/summary.json").write_text(json.dumps(report, indent=2)+"\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary+"\n")
          PY
      - name: Preserve raw coverage and counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-lcov
          path: coverage/
          retention-days: 30
          if-no-files-found: warn
