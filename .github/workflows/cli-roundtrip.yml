# Isolated real CLI roundtrip triage, fork only.
name: CLI roundtrip regression
on:
  push:
    branches: [fix/cli-roundtrip-20261012, test/cli-perf-unit-contracts-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-roundtrip-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: quality-cli-roundtrip
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p designcraft-cli --all-targets --locked -- -D warnings
      - run: cargo test -p designcraft-cli --locked -- --nocapture
      - name: Export mismatching synthetic outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-roundtrip-diagnostics
          path: target/test-artifacts/cli-roundtrip/
          if-no-files-found: warn
          retention-days: 14
