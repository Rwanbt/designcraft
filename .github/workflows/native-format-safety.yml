# Bounded parsing regression checks; isolates the native document reader from GUI tests.
name: Native document archive safety

on:
  push:
    branches: [fix/native-zip-bounded-load-20261013]
  pull_request:
    branches: [main]
    paths:
      - "crates/format/**"
      - ".github/workflows/native-format-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-format-safety-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  native-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-format-safety
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p designcraft-format --all-targets --locked -- -D warnings
      - run: cargo test -p designcraft-format --lib --locked -- --nocapture
